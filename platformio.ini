; ═══════════════════════════════════════════════════════════════════════════════
; RailCommand ESP32-C3 Sensor Node - PlatformIO Configuration
; ═══════════════════════════════════════════════════════════════════════════════
;
; MULTI-NODE SETUP:
;   Node-1: 192.168.0.251  ->  pio run -t upload -e node1
;   Node-2: 192.168.0.252  ->  pio run -t upload -e node2
;   Node-3: 192.168.0.253  ->  pio run -t upload -e node3
;
; ═══════════════════════════════════════════════════════════════════════════════

; Common settings for all ESP32-C3 boards
[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; Common build flags
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0

; Libraries
lib_deps =
    olikraus/U8g2@^2.35.9
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

; Partitions for OTA support
board_build.partitions = min_spiffs.csv

; ═══════════════════════════════════════════════════════════════════════════════
; NODE CONFIGURATIONS - Use these to flash specific nodes
; ═══════════════════════════════════════════════════════════════════════════════

[env:node1]
; Node-1: Static IP 192.168.0.251
build_flags =
    ${env.build_flags}
    -DNODE_ID=1

[env:node2]
; Node-2: Static IP 192.168.0.252
build_flags =
    ${env.build_flags}
    -DNODE_ID=2

[env:node3]
; Node-3: Static IP 192.168.0.253
build_flags =
    ${env.build_flags}
    -DNODE_ID=3

; ═══════════════════════════════════════════════════════════════════════════════
; LEGACY - Original generic environment (defaults to Node-1)
; ═══════════════════════════════════════════════════════════════════════════════

[env:esp32c3]
build_flags =
    ${env.build_flags}
    -DNODE_ID=1

; ═══════════════════════════════════════════════════════════════════════════════
; OTA Upload Configurations
; ═══════════════════════════════════════════════════════════════════════════════

[env:node1_ota]
extends = env:node1
upload_protocol = espota
upload_port = 192.168.0.251
upload_flags = --auth=railcmd

[env:node2_ota]
extends = env:node2
upload_protocol = espota
upload_port = 192.168.0.252
upload_flags = --auth=railcmd

[env:node3_ota]
extends = env:node3
upload_protocol = espota
upload_port = 192.168.0.253
upload_flags = --auth=railcmd

; ═══════════════════════════════════════════════════════════════════════════════
; Debug Configuration
; ═══════════════════════════════════════════════════════════════════════════════

[env:debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DNODE_ID=1
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_MODE=1
